name: Release
# On every merge to main that changes the skill: bump the patch version in all
# manifests (so Claude Code / Codex / Copilot / Factory installs auto-update),
# tag it, and attach a reproducible seecode.zip for Claude.ai uploads.
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'commands/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
  workflow_dispatch:
    inputs:
      bump:
        description: patch | minor | major
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency: release

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # este job faz push do commit de versão: mantém as credenciais do checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      # valores de ${{ }} entram por env, nunca colados no script do shell
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          node tools/bump-version.mjs "$BUMP"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # o bot do Actions assina o commit: nem um mantenedor nem o dono do fork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
      - run: node tools/build-zip.mjs
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/seecode.zip \
            --title "SeeCode v$VERSION" --generate-notes
