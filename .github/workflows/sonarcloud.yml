name: SonarCloud analysis

# Análise no SonarQube Cloud. Chave do projeto e organização ficam em secrets
# (SONAR_PROJECT_KEY, SONAR_ORGANIZATION), não no código: assim não aparecem
# no repositório e saem mascaradas (***) nos logs públicos do Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # SonarCloud decora o PR com o resultado

jobs:
  Analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo para o blame do Sonar
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/lcov.info test/*.test.mjs

      # sonarqube-scan-action substitui a sonarcloud-github-action, descontinuada:
      # a antiga roda o scanner com Java 17, que o SonarQube Cloud não aceita mais
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.tests=test
            -Dsonar.exclusions=coverage/**,dist/**,node_modules/**,skills/seecode/scripts/vendor/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
