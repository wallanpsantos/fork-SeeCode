name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
        # Windows on 22 only: cmd.exe leaves test/*.test.mjs unexpanded, and
        # node --test expands globs itself only from Node 21
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # no npm install: the skill has zero runtime dependencies (export uses the runner's Chrome)
      - run: node skills/seecode/scripts/seecode.mjs doctor
      - run: npm test

  # install the skill the way users do (npx skills add) and render with it
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # the skills installer needs >= 22.20
      - run: node --test test/install.test.mjs
        env:
          SEECODE_INSTALL_TEST: '1'

  # versions are bumped by the Release workflow after merge, never in a PR
  version-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/check-version-unchanged.mjs "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
